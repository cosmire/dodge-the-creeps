name: verify

# Runs on every change, and weekly with nobody touching anything — a template
# can break because the world moved, not because the code did.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily. Actions minutes are free for public repos, and the canary tracks
    # a moving target — a daily run means one day of upstream commits to diff
    # when it breaks, not seven. It also keeps the user-facing "verified"
    # timestamp fresh.
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch:

env:
  GODOT_PIN: "4.5.2"
  GODOT_CANARY: "4.7.1"

# GITHUB_TOKEN is read-only by default; these jobs write status back and
# open issues, so the grants have to be explicit.
permissions:
  contents: write
  issues: write

jobs:
  # ── STABLE: the exact combination a developer gets. Must stay green. ──
  stable:
    name: stable (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Lockfile — generate on first run, then enforce
        working-directory: rust
        # A pinned rev alone is not reproducibility; the lockfile pins the
        # whole dependency graph. Bootstraps itself, then --locked keeps it
        # honest: the build fails if the lockfile would need to change.
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --locked --verbose
          else
            echo "No Cargo.lock — generating one to be committed."
            cargo generate-lockfile
          fi

      # Each check records its outcome instead of aborting the job. Without
      # this a failure stops the run before status is written, the previous
      # green file stays published, and the site reports a pass for a template
      # that is broken — the one thing the status panel exists to prevent.
      # The job is still failed deliberately at the end, after publishing.
      - name: Build Rust library
        id: build
        continue-on-error: true
        working-directory: rust
        run: cargo build --verbose

      - name: Run Rust unit tests
        id: tests
        continue-on-error: true
        working-directory: rust
        # Counted rather than pass/fail: the site renders "40/42" in red on its
        # own, so publishing the real numbers says more than a verdict does.
        run: |
          set -o pipefail
          cargo test --verbose 2>&1 | tee /tmp/test-output.txt

      - name: Install Godot ${{ env.GODOT_PIN }} (headless)
        run: |
          URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_PIN }}-stable/Godot_v${{ env.GODOT_PIN }}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v${{ env.GODOT_PIN }}-stable_linux.x86_64 godot-bin
          chmod +x godot-bin

      - name: Import project and load the Rust library
        id: import
        continue-on-error: true
        # Catches what the compiler cannot see: library built but Godot can't
        # load it, class name mismatch, scene referencing a missing node.
        run: ./godot-bin --headless --path godot --import

      # Everything below is measured, not asserted. A number typed into this
      # file is a claim; a number counted here is a fact.
      - name: Measure the template
        id: measure
        if: always()
        run: |
          # Modules are declared in lib.rs, which registers classes and nothing
          # else. Counting declarations rather than files or directories works
          # whether a module is foo.rs or foo/mod.rs.
          echo "modules=$(grep -c '^mod ' rust/src/lib.rs || echo 0)" >> "$GITHUB_OUTPUT"
          echo "loc=$(find rust/src -name '*.rs' -not -path '*/target/*' -exec cat {} + | wc -l)" >> "$GITHUB_OUTPUT"

          # Provenance is checkable only as far as the record existing. Whether
          # its contents are true is not something a machine can judge, and the
          # page claims no more than that.
          if [ -s NOTICE ]; then echo "notice=pass" >> "$GITHUB_OUTPUT"
          else echo "notice=fail" >> "$GITHUB_OUTPUT"; fi

          echo "rust=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

          # Cargo.toml pins an exact rev; Cargo.lock knows which release that
          # commit belongs to. The rev is what we pin, the release is what a
          # developer recognises, so the page shows both.
          VER=$(awk '/^name = "godot"$/{f=1} f&&/^version = /{gsub(/"/,"",$3); print $3; exit}' rust/Cargo.lock)
          # head -1 because a git source carries the rev twice, once in the
          # query and once in the fragment: ...?rev=410580d...#410580d...
          REV=$(awk '/^name = "godot"$/{f=1} f&&/^source = /{print; exit}' rust/Cargo.lock \
                | grep -o '[0-9a-f]\{40\}' | head -1 || true)
          echo "gdext=${VER}" >> "$GITHUB_OUTPUT"
          echo "gdext_rev=${REV}" >> "$GITHUB_OUTPUT"

          # "40/42" if the numbers are there, otherwise the step outcome.
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/test-output.txt | awk '{s+=$1} END{print s+0}')
          FAILED=$(grep -oE '[0-9]+ failed' /tmp/test-output.txt | awk '{s+=$1} END{print s+0}')
          if [ "$((PASSED + FAILED))" -gt 0 ]; then
            echo "tests=${PASSED}/$((PASSED + FAILED))" >> "$GITHUB_OUTPUT"
          else
            echo "tests=${{ steps.tests.outcome == 'success' && 'pass' || 'fail' }}" >> "$GITHUB_OUTPUT"
          fi

      # `if: always()` is the whole point. A red build must publish a red status
      # — otherwise the last green file stays up and the site keeps claiming a
      # pass that is no longer true.
      - name: Write status
        if: always()
        run: |
          mkdir -p status
          cat > status/stable.json <<EOF
          {
            "template": "dodge-the-creeps",
            "lane": "stable",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "versions": {
              "godot": "${{ env.GODOT_PIN }}",
              "rust": "${{ steps.measure.outputs.rust }}",
              "gdext": "${{ steps.measure.outputs.gdext }}",
              "gdext_rev": "${{ steps.measure.outputs.gdext_rev }}"
            },
            "build": "${{ steps.build.outcome == 'success' && 'pass' || 'fail' }}",
            "tests": "${{ steps.measure.outputs.tests }}",
            "import": "${{ steps.import.outcome == 'success' && 'pass' || 'fail' }}",
            "notice": "${{ steps.measure.outputs.notice }}",
            "modules": ${{ steps.measure.outputs.modules }},
            "loc": ${{ steps.measure.outputs.loc }}
          }
          EOF
          cat status/stable.json

      - name: Publish status
        if: always() && github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update stable status"
          file_pattern: status/*.json rust/Cargo.lock

      # Last, so the run is red when it should be — but only after the truth
      # has been published. Ordering these the other way would trade an honest
      # status file for a red badge.
      - name: Fail the run if any check failed
        if: always()
        run: |
          BUILD="${{ steps.build.outcome }}"
          TESTS="${{ steps.tests.outcome }}"
          IMPORT="${{ steps.import.outcome }}"
          echo "build=$BUILD tests=$TESTS import=$IMPORT"
          if [ "$BUILD" != "success" ] || [ "$TESTS" != "success" ] || [ "$IMPORT" != "success" ]; then
            echo "::error::the pinned combination is broken; status published as failing"
            exit 1
          fi

  # ── CANARY: builds against latest. Allowed to fail; failure is early warning. ──
  canary:
    name: canary (latest)
    runs-on: ubuntu-latest
    # Allowed to fail without failing the run, but the outcome is published
    # explicitly — `continue-on-error` makes needs.<job>.result read as
    # 'success' downstream, which silently disabled the reporting job.
    continue-on-error: true
    outputs:
      broke: ${{ steps.verdict.outputs.broke }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpin gdext and the toolchain
        working-directory: rust
        run: |
          sed -i 's/, rev = "[a-f0-9]*"//' Cargo.toml
          rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Build against latest gdext
        id: build_latest
        continue-on-error: true
        working-directory: rust
        run: cargo build --verbose

      - name: Install Godot ${{ env.GODOT_CANARY }} (headless)
        run: |
          URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_CANARY }}-stable/Godot_v${{ env.GODOT_CANARY }}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v${{ env.GODOT_CANARY }}-stable_linux.x86_64 godot-bin
          chmod +x godot-bin

      - name: Import on latest Godot
        id: import_latest
        continue-on-error: true
        run: ./godot-bin --headless --path godot --import

      - name: Record canary verdict
        id: verdict
        if: always()
        run: |
          if [ "${{ steps.build_latest.outcome }}" = "failure" ] || \
             [ "${{ steps.import_latest.outcome }}" = "failure" ]; then
            echo "broke=true" >> "$GITHUB_OUTPUT"
          else
            echo "broke=false" >> "$GITHUB_OUTPUT"
          fi

  # A red canary is a signal, not an outage — it means migration work is coming.
  report-canary:
    needs: canary
    if: always() && needs.canary.outputs.broke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open a migration issue
        run: |
          gh issue list --label canary --state open --json number \
            | grep -q '"number"' || \
          gh issue create --label canary \
            --title "Canary failing: upcoming toolchain break" \
            --body "The canary lane failed. The pinned build is still green, so users are unaffected, but a future gdext/Godot upgrade will break this template. Investigate before bumping the pins."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job: the delivery path is verified independently so a packaging
  # problem cannot block the build status from publishing.
  scaffold:
    name: scaffold (cargo-generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate a project and check it matches a clone
        run: |
          cargo install cargo-generate --locked --quiet
          cd /tmp
          cargo generate --path "$GITHUB_WORKSPACE" --name cosmire-scaffold-test --silent
          for f in rust/Cargo.toml rust/rust-toolchain.toml godot/project.godot godot/rust.gdextension; do
            test -f "cosmire-scaffold-test/$f" || { echo "missing $f in generated project"; exit 1; }
          done
